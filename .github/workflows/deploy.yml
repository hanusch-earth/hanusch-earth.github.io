# Builds the site and publishes it on GitHub Pages.
# Runs on every push to main, by hand (Actions tab) and from Baserow:
# - "baserow": a table changed (webhooks -> automation "Rebuild website").
#   Waits 10 minutes; every further change restarts the wait, so one editing
#   session gives one build.
# - "publish": the "Publish now" button in Baserow (automation "Publish now"),
#   builds right away.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [baserow, publish]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  wait:
    if: github.event.action == 'baserow'
    runs-on: ubuntu-latest
    concurrency:
      group: baserow-wait
      cancel-in-progress: true
    steps:
      - run: sleep 600

  build:
    needs: wait
    if: always() && (needs.wait.result == 'success' || needs.wait.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Pulls the current content from Baserow; without the secret the
      # JSON files in site/src/data are used as they are.
      - run: npm run build
        env:
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
