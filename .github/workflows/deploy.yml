# Builds the site and publishes it on GitHub Pages.
# Runs on every push to main, by hand (Actions tab) and when content changes
# in Baserow (table webhooks -> Baserow automation "Rebuild website" ->
# repository_dispatch with event type "baserow").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [baserow]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Pulls the current content from Baserow; without the secret the
      # JSON files in site/src/data are used as they are.
      - run: npm run build
        env:
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
